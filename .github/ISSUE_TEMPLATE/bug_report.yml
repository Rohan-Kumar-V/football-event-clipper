name: Bug report
description: Report a reproducible problem in the dashboard or ingestion pipeline.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: The dashboard crashed when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Start dashboard with ...
        2. Select video ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste dashboard or terminal logs. Remove private paths, API keys, or sensitive filenames first.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 14, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11.8
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: How did you run it?
      placeholder: .\run_dashboard.ps1 or python dashboard.py --open
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private paths, video filenames, API keys, and secrets from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
