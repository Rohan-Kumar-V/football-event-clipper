name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow, limitation, or user need does this address?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you want.
      placeholder: Add a dashboard option to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention any workaround or different design you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - OCR calibration
        - Event detection
        - VLM validation
        - Review/export workflow
        - Installation/setup
        - Documentation
        - Other
    validations:
      required: true
